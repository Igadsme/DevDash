services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devdash
      POSTGRES_USER: devdash
      POSTGRES_PASSWORD: devdash
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdash -d devdash"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - devdash-postgres:/var/lib/postgresql/data

volumes:
  devdash-postgres:
